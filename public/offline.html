<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión — Nexora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1D4ED8;
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .caja { max-width: 380px; }
        .icono { width: 64px; height: 64px; margin: 0 auto 20px; opacity: .9; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14px; opacity: .85; line-height: 1.5; margin-bottom: 24px; }
        button {
            background: #fff; color: #1D4ED8; border: none; border-radius: 10px;
            padding: 12px 22px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        button:hover { opacity: .92; }
    </style>
</head>
<body>
    <div class="caja">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.008v.008H12v-.008z" />
        </svg>
        <h1>Sin conexión</h1>
        <p>No se pudo conectar con el servidor de Nexora. Revisa tu red — por seguridad, no se muestran datos de ventas o inventario guardados en el celular.</p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
